      function formatDuration(seconds){if(!Number.isFinite(seconds))return '—';const days=Math.floor(seconds/86400),hours=Math.floor(seconds%86400/3600),minutes=Math.floor(seconds%3600/60);return days?`${days}d ${hours}h`:`${hours}h ${minutes}m`}
      function number(n){return Number(n||0).toLocaleString('es-MX')}
      function updateStatus(data){state.status=data;const online=!!data.online;$('#status-title').textContent=online?'En línea':'Sin conexión';$('#status-copy').textContent=online?`${data.name||'Nayrux'} está conectado a Discord`:'No se pudo confirmar la conexión del bot';$('#status-panel').classList.toggle('status-down',!online);$('#status-guilds').textContent=number(data.guilds);$('#status-members').textContent=number(data.members);$('#status-latency').textContent=data.latency_ms==null?'—':`${data.latency_ms} ms`;$('#status-uptime').textContent=formatDuration(data.uptime_seconds);$('#home-guilds').textContent=online?number(data.guilds):'—';$('#hero-guilds').textContent=online?number(data.guilds):'—';$('#hero-members').textContent=online?number(data.members):'—';$('#home-latency').textContent=data.latency_ms==null?'—':`${data.latency_ms} ms`;$('#home-state').textContent=online?'En línea':'Sin conexión';$('#home-dot').style.background=online?'#65d98c':'#ed7171';if(data.avatar){$('#hero-avatar').src=data.avatar;$('#hero-avatar').hidden=false}$('#status-updated').textContent=`Actualizado ${new Date((data.checked_at||Date.now()/1000)*1000).toLocaleTimeString('es-MX')} · se actualiza cada 30 s`}
      async function refreshStatus(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();updateStatus(await r.json())}catch{updateStatus({online:false,checked_at:Date.now()/1000})}}
      loadCommands();refreshStatus();setInterval(refreshStatus,30000);
      const form=$('#embed-form'),fields=$('#embed-fields');
      function addField(name='',value=''){if(fields.children.length>=25){toast('Discord permite hasta 25 campos.');return}const row=document.createElement('div');row.className='field-entry';row.innerHTML='<input maxlength="256" aria-label="Nombre del campo" placeholder="Nombre"><input maxlength="1024" aria-label="Valor del campo" placeholder="Valor"><button type="button" class="remove-field" aria-label="Quitar campo">×</button>';row.children[0].value=name;row.children[1].value=value;row.addEventListener('input',updateEmbed);row.querySelector('button').addEventListener('click',()=>{row.remove();updateEmbed()});fields.append(row);updateEmbed()}
      $('#add-field').addEventListener('click',()=>addField());form.addEventListener('input',updateEmbed);
      function embedData(){const title=$('#embed-title').value.trim(),description=$('#embed-description').value.trim(),footer=$('#embed-footer').value.trim(),color=$('#embed-color').value;const embed={};if(title)embed.title=title;if(description)embed.description=description;embed.color=parseInt(color.slice(1),16);const list=$$('.field-entry',fields).map(row=>({name:row.children[0].value.trim(),value:row.children[1].value.trim(),inline:true})).filter(f=>f.name&&f.value);if(list.length)embed.fields=list;if(footer)embed.footer={text:footer};return {embeds:[embed]}}
      function updateEmbed(){const data=embedData().embeds[0],title=$('#preview-title'),description=$('#preview-description'),footer=$('#preview-footer'),preview=$('#embed-preview');title.textContent=data.title||'';title.hidden=!data.title;description.textContent=data.description||'Tu descripción aparecerá aquí.';footer.textContent=data.footer?.text||'';footer.hidden=!data.footer;preview.style.borderLeftColor=$('#embed-color').value;$('#preview-fields').innerHTML=(data.fields||[]).map(f=>`<div><strong>${escapeHtml(f.name)}</strong><span>${escapeHtml(f.value)}</span></div>`).join('');$('#json-output').textContent=JSON.stringify(embedData(),null,2)}
      $('#copy-json').addEventListener('click',()=>copyText(JSON.stringify(embedData(),null,2),'JSON del embed copiado'));$('#toggle-json').addEventListener('click',()=>$('#json-output').classList.toggle('visible'));
      route();
    })();
  </script>
