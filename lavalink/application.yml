server:
  address: 0.0.0.0
  port: 2333

lavalink:
  pluginsDir: "/tmp"
  server:
    sources:
      youtube: false
      soundcloud: false
      bandcamp: true
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 100
    soundcloudPlaylistLoadLimit: 100
    gc-warnings: true
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  lavasrc:
    sources:
      youtube: false
      ytdlp: true
    ytdlp:
      path: "yt-dlp"
      searchLimit: 8
      customLoadArgs:
        - "--remote-components"
        - "ejs:github"
        - "--cookies"
        - "/tmp/youtube-cookies.txt"
        - "-q"
        - "--no-warnings"
        - "--flat-playlist"
        - "--skip-download"
        - "-J"
      customPlaybackArgs:
        - "--remote-components"
        - "ejs:github"
        - "--cookies"
        - "/tmp/youtube-cookies.txt"
        - "-q"
        - "--no-warnings"
        - "-f"
        - "bestaudio"
        - "-J"
  soundy:
    enabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
