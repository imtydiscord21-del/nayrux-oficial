server:
  address: 0.0.0.0
  port: 2333

lavalink:
  pluginsDir: "/tmp"
  server:
    sources:
      youtube: false
      soundcloud: false
      bandcamp: true
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 100
    soundcloudPlaylistLoadLimit: 100
    gc-warnings: true
plugins:
  youtube:
    enabled: true
    allowSearch: true
    clients:
      - MWEB
      - TV
      - WEB
      - MUSIC
      - ANDROID_MUSIC
      - WEBEMBEDDED
      - ANDROID_VR
      - TVHTML5_SIMPLY
    remotePot:
      url: "${YOUTUBE_REMOTE_POT_URL:https://pot.ashtongg.me}"
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
  soundy:
    enabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
